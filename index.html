<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><title>Prosek Volejbal</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#111;background:#f2f2f7;--bg:#f2f2f7;--card:#fff;--header:#f8f8fccc;--text:#111;--muted:#666;--line:#ddd;--pill:#e5e5ea;--active:#111;--activeText:#fff;--today:#e9e9ee;--modal:#fff}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--header:#1c1c1ecc;--text:#f5f5f7;--muted:#aaa;--line:#38383a;--pill:#2c2c2e;--active:#f5f5f7;--activeText:#111;--today:#2c2c2e;--modal:#1c1c1e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);transition:background .2s,color .2s}.app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--header);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:30px;margin:0 0 10px}.bar{display:flex;gap:7px;align-items:center}.bar button,.iconbtn{border:0;background:var(--pill);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:600}.month{flex:1;text-align:center;font-weight:700}
.filters{display:flex;gap:7px;overflow:auto;padding:10px 16px}.filters button{border:0;border-radius:18px;padding:8px 13px;background:var(--card);color:var(--text);white-space:nowrap}.filters button.active{background:var(--active);color:var(--activeText)}
.calendar{background:var(--card);margin:0 12px 12px;border-radius:18px;padding:10px;box-shadow:0 1px 3px #0001}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}.day{min-height:62px;border-radius:10px;padding:5px;font-size:12px}.day.today{background:var(--today)}.day .n{font-weight:700}.evt{font-size:10px;line-height:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evt b{font-weight:700}
.events{padding:0 12px 40px}.datehead{font-size:14px;font-weight:700;margin:18px 4px 6px}.event{background:var(--card);border-radius:16px;padding:13px;margin:7px 0;box-shadow:0 1px 3px #0001}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:var(--pill);font-weight:700;margin-right:5px;color:var(--text)}.event b{display:block;font-size:16px;margin:7px 0}.event small{color:var(--muted)}.status{font-size:12px;color:var(--muted);padding:0 16px 8px}
.panel{background:var(--card);margin:0 12px 16px;border-radius:18px;padding:14px;box-shadow:0 1px 3px #0001}.panel h2{margin:0 0 8px;font-size:18px}.panel p{margin:5px 0;color:var(--muted);font-size:13px}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px}.field textarea{min-height:70px;resize:vertical}.save{margin-top:10px;border:0;border-radius:11px;background:var(--active);color:var(--activeText);padding:10px 14px;font-weight:700}.privacy{font-size:11px;color:var(--muted);margin-top:8px}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.open{display:flex}.sheet{width:min(760px,100%);background:var(--modal);color:var(--text);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheetHead h2{margin:0}.close{border:0;background:var(--pill);color:var(--text);border-radius:50%;width:34px;height:34px;font-size:18px}.themeRow{display:flex;gap:8px}.themeRow button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--pill);color:var(--text);font-weight:700}.themeRow button.selected{background:var(--active);color:var(--activeText)}
@media(max-width:500px){.profileGrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.addBtn,.save{border:0;border-radius:14px;padding:11px 14px;background:var(--active);color:var(--activeText);font-weight:700}.training{border-left:4px solid var(--active)}.deleteBtn{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:7px 10px}.trainingForm{display:grid;gap:12px}.trainingForm input,.trainingForm textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit}.trainingForm textarea{min-height:80px;resize:vertical}.formActions{display:flex;gap:8px}.formActions button{flex:1}</style></head><body><main class="app">
<header><h1>Prosek Volejbal</h1><div class="bar"><button onclick="move(-1)">‹</button><div class="month" id="month"></div><button onclick="move(1)">›</button><button onclick="today()">Dnes</button><button onclick="sync()">↻</button><button class="iconbtn" onclick="openSettings()" aria-label="Nastavení">⚙︎</button></div></header>
<div class="filters" id="filters"></div><div class="status" id="status"></div>
<div class="calendar"><div class="week"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="days" id="days"></div></div>
<section class="events"><div class="sectionHead"><h2>Kalendář</h2><button class="addBtn" onclick="openTraining()">＋ Přidat trénink</button></div><div id="events"></div></section>
</main>
<div class="overlay" id="settingsOverlay" onclick="closeIfBackdrop(event)"><div class="sheet"><div class="sheetHead"><h2>Nastavení</h2><button class="close" onclick="closeSettings()">×</button></div>
<p>Vzhled aplikace</p><div class="themeRow"><button id="lightBtn" onclick="setTheme('light')">☀️ Světlý</button><button id="darkBtn" onclick="setTheme('dark')">🌙 Tmavý</button><button id="systemBtn" onclick="setTheme('system')">⚙️ Systém</button></div>
<div class="panel" style="margin:16px 0 0;padding:0;box-shadow:none"><h2>Moje údaje</h2><p>Údaje se ukládají pouze do tohoto zařízení.</p><div class="profileGrid">
<div class="field"><label>Jméno</label><input id="pName" autocomplete="name" placeholder="Např. Jan Novák"></div>
<div class="field"><label>Tým</label><input id="pTeam" placeholder="Např. U18"></div>
<div class="field"><label>Číslo dresu</label><input id="pNumber" inputmode="numeric" placeholder="Např. 7"></div>
<div class="field"><label>Telefon</label><input id="pPhone" type="tel" autocomplete="tel" placeholder="Volitelné"></div>
<div class="field full"><label>E-mail</label><input id="pEmail" type="email" autocomplete="email" placeholder="Volitelné"></div>
<div class="field full"><label>Poznámka</label><textarea id="pNote" placeholder="Např. trenér, rodič, další informace…"></textarea></div>
</div><button class="save" onclick="saveProfile()">Uložit moje údaje</button><div class="privacy">Tyto údaje se neposílají na GitHub ani na ČVS. Jsou uložené jen v prohlížeči tohoto zařízení.</div></div>
</div></div>
<div class="overlay" id="trainingOverlay" onclick="closeTrainingBackdrop(event)"><div class="sheet"><div class="sheetHead"><h2>＋ Přidat trénink</h2><button class="close" onclick="closeTraining()">×</button></div>
<div class="trainingForm">
<div class="field"><label>Datum</label><input id="trDate" type="date"></div>
<div class="field"><label>Začátek</label><input id="trTime" type="time"></div>
<div class="field"><label>Délka (minuty)</label><input id="trDuration" type="number" min="15" step="15" value="90"></div>
<div class="field"><label>Místo</label><input id="trPlace" placeholder="Např. hala Prosek"></div>
<div class="field"><label>Poznámka</label><textarea id="trNote" placeholder="Např. kondiční trénink"></textarea></div>
<div class="formActions"><button class="save" onclick="saveTraining()">Uložit trénink</button><button class="deleteBtn" onclick="closeTraining()">Zrušit</button></div>
</div></div></div><script>
const cats=["Vše","U18","U20","U22","Tréninky"];let filter="Vše",current=new Date();current.setDate(1);let matches=[],trainings=JSON.parse(localStorage.getItem("prosekTrainings")||"[]");
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function applyTheme(){const t=localStorage.getItem("prosekTheme")||"system";const dark=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";document.querySelector('meta[name="theme-color"]').content=dark?"#000000":"#f2f2f7";if(document.getElementById("lightBtn")){document.getElementById("lightBtn").classList.toggle("selected",t==="light");document.getElementById("darkBtn").classList.toggle("selected",t==="dark");document.getElementById("systemBtn").classList.toggle("selected",t==="system")}}
function setTheme(t){localStorage.setItem("prosekTheme",t);applyTheme()}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if((localStorage.getItem("prosekTheme")||"system")==="system")applyTheme()});
function openSettings(){loadProfile();applyTheme();document.getElementById("settingsOverlay").classList.add("open")}function closeSettings(){document.getElementById("settingsOverlay").classList.remove("open")}function closeIfBackdrop(e){if(e.target.id==="settingsOverlay")closeSettings()}
function loadProfile(){const p=JSON.parse(localStorage.getItem("prosekProfile")||"{}");for(const k of ["Name","Team","Number","Phone","Email","Note"]){const el=document.getElementById("p"+k);if(el)el.value=p[k.toLowerCase()]||""}}
function saveProfile(){const p={name:pName.value,team:pTeam.value,number:pNumber.value,phone:pPhone.value,email:pEmail.value,note:pNote.value};localStorage.setItem("prosekProfile",JSON.stringify(p));alert("Moje údaje jsou uložené v tomto zařízení.")}
function openTraining(){const d=new Date();trDate.value=d.toISOString().slice(0,10);trTime.value="17:00";trDuration.value=90;trPlace.value="";trNote.value="";document.getElementById("trainingOverlay").classList.add("open")}
function closeTraining(){document.getElementById("trainingOverlay").classList.remove("open")}
function closeTrainingBackdrop(e){if(e.target.id==="trainingOverlay")closeTraining()}
function saveTraining(){if(!trDate.value||!trTime.value){alert("Vyber datum a začátek tréninku.");return}const item={id:Date.now(),d:trDate.value,t:trTime.value,c:"Tréninky",h:"Trénink",a:"",v:trPlace.value||"Místo nebylo zadáno",note:trNote.value||"",duration:Number(trDuration.value)||90};trainings.push(item);localStorage.setItem("prosekTrainings",JSON.stringify(trainings));closeTraining();render()}
function deleteTraining(id){trainings=trainings.filter(x=>x.id!==id);localStorage.setItem("prosekTrainings",JSON.stringify(trainings));render()}
async function load(){try{const r=await fetch("events.json?"+Date.now(),{cache:"no-store"});const j=await r.json();matches=(j.events||[]).filter(x=>["U18","U20","U22"].includes(x.c));document.getElementById("status").textContent="Aktualizováno: "+new Date(j.updatedAt).toLocaleString("cs-CZ")}catch(e){matches=[];document.getElementById("status").textContent="Rozpis se nepodařilo načíst."}render()}
function sync(){load()}function move(n){current.setMonth(current.getMonth()+n);render()}function today(){current=new Date();current.setDate(1);render()}
document.getElementById("filters").innerHTML=cats.map(c=>`<button class="${c==="Vše"?"active":""}" onclick="setFilter('${c}',this)">${c}</button>`).join("");
function setFilter(c,b){filter=c;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}function allEvents(){return matches.concat(trainings)}
function filtered(){return allEvents().filter(x=>filter==="Vše"||x.c===filter).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))}
function render(){document.getElementById("month").textContent=new Intl.DateTimeFormat("cs-CZ",{month:"long",year:"numeric"}).format(current);const first=new Date(current.getFullYear(),current.getMonth(),1),last=new Date(current.getFullYear(),current.getMonth()+1,0),start=(first.getDay()+6)%7;let h="";for(let i=0;i<start;i++)h+="<div></div>";for(let day=1;day<=last.getDate();day++){const ds=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;const es=filtered().filter(x=>x.d===ds);h+=`<div class="day ${ds===new Date().toISOString().slice(0,10)?"today":""}"><div class="n">${day}</div>${es.slice(0,3).map(x=>`<div class="evt"><b>${x.t}</b> ${x.c}</div>`).join("")}</div>`}document.getElementById("days").innerHTML=h;const by={};filtered().forEach(x=>(by[x.d]??=[]).push(x));document.getElementById("events").innerHTML=Object.entries(by).map(([d,es])=>`<div class="datehead">${fmtDate(d)}</div>${es.map(x=>x.c==="Tréninky"?`<article class="event training"><div class="top"><span><span class="badge">Trénink</span>${x.h}</span><strong>${x.t}</strong></div><b>${x.duration||90} minut</b><small>📍 ${x.v||"Místo nebylo zadáno"}</small>${x.note?`<small>📝 ${x.note}</small>`:""}<button class="deleteBtn" onclick="deleteTraining(${x.id})">Smazat trénink</button></article>`:`<article class="event"><div class="top"><span><span class="badge">${x.c}</span>${x.type||"Zápas"}</span><strong>${x.t}</strong></div><b>${x.h} – ${x.a}</b><small>📍 ${x.v||"Místo dle ČVS"}</small></article>`).join("")}`).join("")||"<p>Pro tuto kategorii nejsou načtené žádné události.</p>"}
applyTheme();load();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
