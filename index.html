<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><title>Prosek Volejbal</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#f8f8fccc;backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid #ddd}
h1{font-size:30px;margin:0 0 10px}.bar{display:flex;gap:7px;align-items:center}.bar button{border:0;background:#e5e5ea;border-radius:10px;padding:8px 11px;font-weight:600}.month{flex:1;text-align:center;font-weight:700}
.filters{display:flex;gap:7px;overflow:auto;padding:10px 16px}.filters button{border:0;border-radius:18px;padding:8px 13px;background:#fff;white-space:nowrap}.filters button.active{background:#111;color:#fff}
.calendar{background:#fff;margin:0 12px 12px;border-radius:18px;padding:10px;box-shadow:0 1px 3px #0001}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#777;font-size:12px;padding:5px 0}.day{min-height:62px;border-radius:10px;padding:5px;font-size:12px}.day.today{background:#e9e9ee}.day .n{font-weight:700}.evt{font-size:10px;line-height:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evt b{font-weight:700}
.events{padding:0 12px 40px}.datehead{font-size:14px;font-weight:700;margin:18px 4px 6px}.event{background:#fff;border-radius:16px;padding:13px;margin:7px 0;box-shadow:0 1px 3px #0001}.top{display:flex;justify-content:space-between;color:#666;font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#eee;font-weight:700;margin-right:5px}.event b{display:block;font-size:16px;margin:7px 0}.event small{color:#666}.status{font-size:12px;color:#666;padding:0 16px 8px}
</style></head><body><main class="app">
<header><h1>Prosek Volejbal</h1><div class="bar"><button onclick="move(-1)">‹</button><div class="month" id="month"></div><button onclick="move(1)">›</button><button onclick="today()">Dnes</button><button onclick="sync()">↻</button></div></header>
<div class="filters" id="filters"></div><div class="status" id="status"></div>
<div class="calendar"><div class="week"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="days" id="days"></div></div>
<section class="events"><h2>Turnaje a zápasy</h2><div id="events"></div></section>
</main>
<script>
const cats=["Vše","U18","U20","U22"];let filter="Vše", current=new Date();current.setDate(1);
let matches=[];
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
async function load(){
 try{const r=await fetch("events.json?"+Date.now(),{cache:"no-store"});const j=await r.json();matches=(j.events||[]).filter(x=>["U18","U20","U22"].includes(x.c));document.getElementById("status").textContent="Aktualizováno: "+new Date(j.updatedAt).toLocaleString("cs-CZ");}
 catch(e){matches=[];document.getElementById("status").textContent="Rozpis se nepodařilo načíst."}
 render();
}
function sync(){load()}
function move(n){current.setMonth(current.getMonth()+n);render()}function today(){current=new Date();current.setDate(1);render()}
document.getElementById("filters").innerHTML=cats.map(c=>`<button class="${c==="Vše"?"active":""}" onclick="setFilter('${c}',this)">${c}</button>`).join("");
function setFilter(c,b){filter=c;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function filtered(){return matches.filter(x=>filter==="Vše"||x.c===filter).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))}
function render(){
 document.getElementById("month").textContent=new Intl.DateTimeFormat("cs-CZ",{month:"long",year:"numeric"}).format(current);
 const first=new Date(current.getFullYear(),current.getMonth(),1),last=new Date(current.getFullYear(),current.getMonth()+1,0),start=(first.getDay()+6)%7;let h="";
 for(let i=0;i<start;i++)h+="<div></div>";
 for(let day=1;day<=last.getDate();day++){
  const ds=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const es=filtered().filter(x=>x.d===ds);h+=`<div class="day ${ds===new Date().toISOString().slice(0,10)?"today":""}"><div class="n">${day}</div>${es.slice(0,3).map(x=>`<div class="evt"><b>${x.t}</b> ${x.c}</div>`).join("")}</div>`;
 }
 document.getElementById("days").innerHTML=h;
 const by={};filtered().forEach(x=>(by[x.d]??=[]).push(x));
 document.getElementById("events").innerHTML=Object.entries(by).map(([d,es])=>`<div class="datehead">${fmtDate(d)}</div>${es.map(x=>`<article class="event"><div class="top"><span><span class="badge">${x.c}</span>${x.type||"Zápas"}</span><strong>${x.t}</strong></div><b>${x.h} – ${x.a}</b><small>📍 ${x.v||"Místo dle ČVS"}</small></article>`).join("")}`).join("")||"<p>Pro tuto kategorii nejsou načtené žádné události.</p>";
}
load();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
