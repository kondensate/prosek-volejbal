<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prosek Volejbal</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--bg:#f2f2f7;--card:#fff;--header:#f8f8fccc;--text:#111;--muted:#6b6b70;--line:#ddd;--pill:#e5e5ea;--active:#111;--activeText:#fff;--today:#e9e9ee;--modal:#fff;--accent:#e51b4f}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--header:#1c1c1ecc;--text:#f5f5f7;--muted:#aaa;--line:#38383a;--pill:#2c2c2e;--active:#f5f5f7;--activeText:#111;--today:#2c2c2e;--modal:#1c1c1e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--header);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:30px;margin:0 0 10px}.bar{display:flex;gap:7px;align-items:center}.bar button,.iconbtn{border:0;background:var(--pill);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:600}.month{flex:1;text-align:center;font-weight:700}
.filters{display:flex;gap:7px;overflow:auto;padding:10px 16px}.filters button{border:0;border-radius:18px;padding:8px 13px;background:var(--card);color:var(--text);white-space:nowrap}.filters button.active{background:var(--active);color:var(--activeText)}
.calendar{background:var(--card);margin:0 12px 12px;border-radius:18px;padding:10px;box-shadow:0 1px 3px #0001}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}.day{min-height:62px;border-radius:10px;padding:5px;font-size:12px}.day.today{background:var(--today)}.day .n{font-weight:700}.evt{font-size:10px;line-height:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evt b{font-weight:700}
.events{padding:0 12px 40px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{font-size:20px}.datehead{font-size:14px;font-weight:700;margin:18px 4px 6px}.event{background:var(--card);border-radius:16px;padding:13px;margin:7px 0;box-shadow:0 1px 3px #0001;cursor:pointer}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:var(--pill);font-weight:700;margin-right:5px;color:var(--text)}.event b{display:block;font-size:16px;margin:7px 0}.event small{color:var(--muted)}.status{font-size:12px;color:var(--muted);padding:0 16px 8px}
.addBtn,.save{border:0;border-radius:14px;padding:11px 14px;background:var(--active);color:var(--activeText);font-weight:700}.training{border-left:4px solid var(--active)}.deleteBtn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:7px 10px}.trainingForm{display:grid;gap:12px}.trainingForm input,.trainingForm textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.trainingForm textarea{min-height:80px;resize:vertical}.formActions{display:flex;gap:8px}.formActions button{flex:1}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.open{display:flex}.sheet{width:min(760px,100%);background:var(--modal);color:var(--text);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheetHead h2{margin:0}.close{border:0;background:var(--pill);color:var(--text);border-radius:50%;width:34px;height:34px;font-size:18px}.themeRow{display:flex;gap:8px}.themeRow button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--pill);color:var(--text);font-weight:700}.themeRow button.selected{background:var(--active);color:var(--activeText)}
.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px}.field textarea{min-height:70px;resize:vertical}.privacy{font-size:11px;color:var(--muted);margin-top:8px}
.detailHero{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:8px 0 18px}.teamBox{background:var(--pill);border-radius:18px;padding:18px 10px;font-weight:700;min-height:95px;display:flex;align-items:center;justify-content:center}.detailTime{font-size:28px;font-weight:800}.detailDate{font-size:13px;color:var(--muted)}.detailMeta{display:grid;gap:8px}.metaRow{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:10px 0}.metaRow span:first-child{color:var(--muted)}.sourceBtn{display:block;text-align:center;margin-top:15px;text-decoration:none;border-radius:12px;background:var(--pill);color:var(--text);padding:11px;font-weight:700}
.rosterTabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.rosterTabs button{border:0;border-radius:18px;padding:8px 13px;background:var(--pill);color:var(--text);white-space:nowrap}.rosterTabs button.active{background:var(--active);color:var(--activeText)}.players{display:grid;gap:8px}.player{background:var(--pill);padding:12px;border-radius:12px;font-weight:600}.teamNote{font-size:12px;color:var(--muted);margin:0 0 12px}
@media(max-width:500px){.profileGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.detailHero{grid-template-columns:1fr}.detailTime{order:-1}}
</style>
</head>
<body><main class="app">
<header><h1>Prosek Volejbal</h1><div class="bar"><button onclick="move(-1)">‹</button><div class="month" id="month"></div><button onclick="move(1)">›</button><button onclick="today()">Dnes</button><button onclick="sync()">↻</button><button class="iconbtn" onclick="openSettings()">⚙︎</button></div></header>
<div class="filters" id="filters"></div><div class="status" id="status"></div>
<div class="calendar"><div class="week"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="days" id="days"></div></div>
<section class="events"><div class="sectionHead"><h2>Kalendář</h2><button class="addBtn" onclick="openTraining()">＋ Trénink</button></div><div id="events"></div></section>
<section class="events"><div class="sectionHead"><h2>Soupisky</h2><button class="addBtn" onclick="openRoster()">👥 Týmy</button></div></section>
</main>

<div class="overlay" id="settingsOverlay" onclick="backdrop(event,'settingsOverlay',closeSettings)"><div class="sheet"><div class="sheetHead"><h2>Nastavení</h2><button class="close" onclick="closeSettings()">×</button></div>
<p>Vzhled aplikace</p><div class="themeRow"><button id="lightBtn" onclick="setTheme('light')">☀️ Světlý</button><button id="darkBtn" onclick="setTheme('dark')">🌙 Tmavý</button><button id="systemBtn" onclick="setTheme('system')">⚙️ Systém</button></div>
<div style="margin-top:18px"><h3>Moje údaje</h3><p class="teamNote">Ukládají se pouze do tohoto zařízení.</p><div class="profileGrid">
<div class="field"><label>Jméno</label><input id="pName"></div><div class="field"><label>Tým</label><input id="pTeam"></div><div class="field"><label>Číslo dresu</label><input id="pNumber" inputmode="numeric"></div><div class="field"><label>Telefon</label><input id="pPhone" type="tel"></div><div class="field full"><label>E-mail</label><input id="pEmail" type="email"></div><div class="field full"><label>Poznámka</label><textarea id="pNote"></textarea></div></div><button class="save" onclick="saveProfile()">Uložit</button></div>
</div></div>

<div class="overlay" id="trainingOverlay" onclick="backdrop(event,'trainingOverlay',closeTraining)"><div class="sheet"><div class="sheetHead"><h2>＋ Přidat trénink</h2><button class="close" onclick="closeTraining()">×</button></div><div class="trainingForm">
<div class="field"><label>Datum</label><input id="trDate" type="date"></div><div class="field"><label>Začátek</label><input id="trTime" type="time"></div><div class="field"><label>Délka (minuty)</label><input id="trDuration" type="number" min="15" step="15" value="90"></div><div class="field"><label>Místo</label><input id="trPlace" placeholder="Např. hala Prosek"></div><div class="field"><label>Poznámka</label><textarea id="trNote"></textarea></div><div class="formActions"><button class="save" onclick="saveTraining()">Uložit trénink</button><button class="deleteBtn" onclick="closeTraining()">Zrušit</button></div></div></div></div>

<div class="overlay" id="detailOverlay" onclick="backdrop(event,'detailOverlay',closeDetail)"><div class="sheet"><div class="sheetHead"><h2>Detail zápasu</h2><button class="close" onclick="closeDetail()">×</button></div><div id="detail"></div></div></div>

<div class="overlay" id="rosterOverlay" onclick="backdrop(event,'rosterOverlay',closeRoster)"><div class="sheet"><div class="sheetHead"><h2>Soupisky</h2><button class="close" onclick="closeRoster()">×</button></div><div class="rosterTabs" id="rosterTabs"></div><p id="rosterNote" class="teamNote"></p><div class="players" id="players"></div></div></div>

<script>
const cats=["Vše","U18","U20","U22","Muži","Tréninky"];
let filter="Vše", current=new Date(); current.setDate(1), matches=[], rosters={};
let trainings=JSON.parse(localStorage.getItem("prosekTrainings")||"[]");

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtShort=s=>new Date(s+"T12:00:00").toLocaleDateString("cs-CZ",{day:"numeric",month:"numeric",year:"numeric"});

function applyTheme(){let t=localStorage.getItem("prosekTheme")||"system";let dark=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";$("lightBtn")?.classList.toggle("selected",t==="light");$("darkBtn")?.classList.toggle("selected",t==="dark");$("systemBtn")?.classList.toggle("selected",t==="system")}
function setTheme(t){localStorage.setItem("prosekTheme",t);applyTheme()}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if((localStorage.getItem("prosekTheme")||"system")==="system")applyTheme()});

function openSettings(){loadProfile();applyTheme();$("settingsOverlay").classList.add("open")}function closeSettings(){$("settingsOverlay").classList.remove("open")}
function loadProfile(){let p=JSON.parse(localStorage.getItem("prosekProfile")||"{}");["Name","Team","Number","Phone","Email","Note"].forEach(k=>{let e=$("p"+k);if(e)e.value=p[k.toLowerCase()]||""})}
function saveProfile(){let p={name:pName.value,team:pTeam.value,number:pNumber.value,phone:pPhone.value,email:pEmail.value,note:pNote.value};localStorage.setItem("prosekProfile",JSON.stringify(p));alert("Uloženo.")}

function openTraining(){let d=new Date();$("trDate").value=d.toISOString().slice(0,10);$("trTime").value="17:00";$("trDuration").value=90;$("trPlace").value="";$("trNote").value="";$("trainingOverlay").classList.add("open")}
function closeTraining(){$("trainingOverlay").classList.remove("open")}
function saveTraining(){if(!$("trDate").value||!$("trTime").value)return alert("Vyber datum a čas.");trainings.push({id:Date.now(),d:$("trDate").value,t:$("trTime").value,c:"Tréninky",h:"Trénink",a:"",v:$("trPlace").value||"Místo nebylo zadáno",note:$("trNote").value||"",duration:Number($("trDuration").value)||90});localStorage.setItem("prosekTrainings",JSON.stringify(trainings));closeTraining();render()}
function deleteTraining(id){trainings=trainings.filter(x=>x.id!==id);localStorage.setItem("prosekTrainings",JSON.stringify(trainings));render()}

async function load(){
 try{
  let [er,rr]=await Promise.all([fetch("events.json?"+Date.now(),{cache:"no-store"}),fetch("rosters.json?"+Date.now(),{cache:"no-store"})]);
  let ej=await er.json(); rosters=await rr.json(); matches=ej.events||[];
  $("status").textContent="Rozpis aktualizován: "+new Date(ej.updatedAt).toLocaleString("cs-CZ");
 }catch(e){$("status").textContent="Nepodařilo se načíst rozpis. Zkus ↻.";matches=[]}
 render()
}
function sync(){load()}
function move(n){current.setMonth(current.getMonth()+n);render()}
function today(){current=new Date();current.setDate(1);render()}

$("filters").innerHTML=cats.map(c=>`<button class="${c==="Vše"?"active":""}" onclick="setFilter('${c}')">${c}</button>`).join("");
function setFilter(c){filter=c;document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.textContent===c));render()}

function allItems(){return [...matches,...trainings]}
function render(){
 let y=current.getFullYear(),m=current.getMonth();$("month").textContent=new Intl.DateTimeFormat("cs-CZ",{month:"long",year:"numeric"}).format(current);
 let first=new Date(y,m,1), start=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate(), todayS=new Date().toISOString().slice(0,10);
 let cells=[];for(let i=0;i<start;i++)cells.push("<div class='day'></div>");
 for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;let es=allItems().filter(e=>e.d===ds && (filter==="Vše"||e.c===filter));cells.push(`<div class="day ${ds===todayS?"today":""}"><div class="n">${d}</div>${es.slice(0,3).map(e=>`<div class="evt"><b>${esc(e.t)}</b> ${esc(e.h||e.a||e.c)}</div>`).join("")}</div>`)}
 $("days").innerHTML=cells.join("");
 let items=allItems().filter(e=>filter==="Vše"||e.c===filter).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
 let groups={};items.forEach(e=>(groups[e.d]??=[]).push(e));
 $("events").innerHTML=Object.keys(groups).map(d=>`<div class="datehead">${fmtDate(d)}</div>`+groups[d].map(eventCard).join("")).join("")||"<p class='teamNote'>Žádné události.</p>";
}
function eventCard(e){
 if(e.c==="Tréninky") return `<article class="event training"><div class="top"><span class="badge">Trénink</span><span>${esc(e.t)}</span></div><b>${esc(e.v)}</b><small>${esc(e.note||"")} · ${e.duration||90} min</small><br><button class="deleteBtn" onclick="event.stopPropagation();deleteTraining(${e.id})">Smazat</button></article>`;
 return `<article class="event" onclick='openDetail(${JSON.stringify(e).replace(/'/g,"&#39;")})'><div class="top"><span><span class="badge">${esc(e.c)}</span>${esc(e.type||"Zápas")}</span><strong>${esc(e.t)}</strong></div><b>${esc(e.h||"SK Prosek Praha")} — ${esc(e.a||"Soupeř")}</b><small>📍 ${esc(e.v||"Místo dle ČVS")} · klepni pro detail</small></article>`;
}
function openDetail(e){
 $("detail").innerHTML=`<div class="detailHero"><div class="teamBox">${esc(e.h||"SK Prosek Praha")}</div><div><div class="detailDate">${esc(fmtShort(e.d))}</div><div class="detailTime">${esc(e.t)}</div></div><div class="teamBox">${esc(e.a||"Soupeř")}</div></div>
<div class="badge">${esc(e.c)}</div> <span>${esc(e.type||"Zápas")}</span>
<div class="detailMeta"><div class="metaRow"><span>Začátek</span><strong>${esc(fmtDate(e.d))} ${esc(e.t)}</strong></div><div class="metaRow"><span>Místo</span><strong>${esc(e.v||"Dle ČVS")}</strong></div>${e.round?`<div class="metaRow"><span>Kolo</span><strong>${esc(e.round)}</strong></div>`:""}${e.number?`<div class="metaRow"><span>Číslo zápasu</span><strong>${esc(e.number)}</strong></div>`:""}</div>
<a class="sourceBtn" target="_blank" rel="noopener" href="${esc(e.source||"https://www.cvf.cz/")}">Otevřít detail na ČVS ↗</a>`;
 $("detailOverlay").classList.add("open")
}
function closeDetail(){$("detailOverlay").classList.remove("open")}

function openRoster(){
 let keys=["U18","U20","U22","Muži"];$("rosterTabs").innerHTML=keys.map((k,i)=>`<button class="${i===0?"active":""}" onclick="showRoster('${k}',this)">${k}</button>`).join("");
 showRoster("U18",$("rosterTabs").firstElementChild);$("rosterOverlay").classList.add("open")
}
function showRoster(k,btn){document.querySelectorAll("#rosterTabs button").forEach(b=>b.classList.remove("active"));btn?.classList.add("active");let arr=rosters[k]||[];$("rosterNote").textContent=`Soupiska SK Prosek Praha — ${k}. Jména jsou převzatá z aktuálního rozpisu/soupisky ČVS.`;$("players").innerHTML=arr.map((p,i)=>`<div class="player">${i+1}. ${esc(p)}</div>`).join("")}
function closeRoster(){$("rosterOverlay").classList.remove("open")}
function backdrop(e,id,fn){if(e.target.id===id)fn()}
applyTheme();load();
</script></body></html>
